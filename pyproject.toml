[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "switchf1"
version = "0.3.0"
description = "Auditable, language-agnostic evaluation of directed switches in labeled text"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.urls]
Repository = "https://github.com/vigneshnara88/SwitchF1"
Documentation = "https://github.com/vigneshnara88/SwitchF1/blob/main/README.md"

[project.scripts]
switchf1 = "switchf1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
